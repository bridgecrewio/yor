apiVersion: apps/v1
kind: Deployment
metadata:
  name: basic-chart-web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: basic-chart
  template:
    metadata:
      labels:
        app: basic-chart
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
