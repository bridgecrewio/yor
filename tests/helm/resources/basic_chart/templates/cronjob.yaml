apiVersion: batch/v1
kind: CronJob
metadata:
  name: basic-chart-cron
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    metadata:
      labels:
        app: basic-chart
    spec:
      template:
        metadata:
          labels:
            app: basic-chart
        spec:
          containers:
            - name: worker
              image: busybox
          restartPolicy: OnFailure
